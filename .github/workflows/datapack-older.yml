name: Test Datapack (26.2)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'MF_datapack/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'MF_datapack/**'
  workflow_dispatch:

jobs:
  test-older:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Zip MF_datapack contents
        run: |
          cd MF_datapack
          zip -r ../MF_datapack.zip .

      - name: Setup Minecraft
        id: minecraft
        uses: ReinIsNOTaDev/setup-minecraft@v0.1.0
        with:
          version: "26.2"

      - uses: actions/setup-java@v5
        with:
          distribution: "microsoft"
          java-version: ${{ fromJson(steps.minecraft.outputs.package).javaVersion.majorVersion }}

      - name: Run Server
        timeout-minutes: 6
        run: |
          echo Running Minecraft ${{ steps.minecraft.outputs.version }}.
          cat <<EOF > server.properties
          initial-enabled-packs=vanilla,file/MF_datapack.zip
          EOF
          echo "eula=true" > eula.txt
          mkdir world
          cd world
          mkdir datapacks
          cd datapacks
          cp ../../MF_datapack.zip ./
          cd ../../
          nohup java -jar $MINECRAFT nogui&> older-server.log &
          sleep 1
          timeout 5m grep -Eq 'Done \([.[:digit:]]*s\)! For help, type "help"' <(tail -f older-server.log) || exit 1

      - name: Filter by errors
        if: ${{ !cancelled() }}
        run: grep -E '\[.*\/ERROR\]' older-server.log || echo No errors!

      - name: Upload server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: older-server.log
          archive: false

